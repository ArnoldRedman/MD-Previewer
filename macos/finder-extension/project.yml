name: MDPreviewerFinderExtension
options:
  deploymentTarget:
    macOS: "10.15"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
targets:
  MDPreviewerFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - FinderSyncExtension.swift
    info:
      path: ExtensionInfo.plist
      properties:
        CFBundleDisplayName: MD Previewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: MDPreviewerFinderSync
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.arnoldredman.mdpreviewer.finder-extension
        PRODUCT_NAME: MDPreviewerFinderExtension
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Extension.entitlements
