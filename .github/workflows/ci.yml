name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test
          cargo build --release
      - name: Verify Windows identity and GUI subsystem
        shell: pwsh
        run: |
          $exe = "target/release/md-previewer.exe"
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToInt16($bytes, $peOffset + 0x5C)
          if ($subsystem -ne 2) { throw "Expected GUI subsystem 2, got $subsystem" }
          if ([System.Text.Encoding]::Unicode.GetString($bytes) -notmatch "MD Previewer") {
            throw "new product metadata is missing"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: md-previewer-windows-x64
          path: target/release/md-previewer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test
          cargo build --release

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and build
        run: |
          ./scripts/verify.sh
          cargo build --release
