name: MDPreviewerMobile
options:
  bundleIdPrefix: io.github.arnoldredman
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  MDPreviewerMobile:
    type: application
    platform: iOS
    sources:
      - path: MDPreviewerMobile
      - path: ../shared
        name: shared
        type: folder
        buildPhase: resources
    resources:
      - path: MDPreviewerMobile/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.arnoldredman.mdpreviewer.mobile
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: MDPreviewerMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets: []
