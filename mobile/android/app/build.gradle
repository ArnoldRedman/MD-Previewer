plugins {
    id "com.android.application"
}

android {
    namespace = "io.github.arnoldredman.mdpreviewer"
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.arnoldredman.mdpreviewer.mobile"
        minSdk = 26
        targetSdk = 36
        versionCode = 10
        versionName = "1.5.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("MD_PREVIEWER_ANDROID_KEYSTORE")
            def keystorePassword = System.getenv("MD_PREVIEWER_ANDROID_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("MD_PREVIEWER_ANDROID_KEY_ALIAS")
            def keyPasswordValue = System.getenv("MD_PREVIEWER_ANDROID_KEY_PASSWORD")
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile = file(keystorePath)
                storePassword = keystorePassword
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("MD_PREVIEWER_ANDROID_KEYSTORE")) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            shrinkResources = false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../shared"]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}
